# KIPscope project file (D-035): how the UI shows signal names and which measurement is open.
# The server reads <repo root>/kipscope.yaml at start (KIPSCOPE_PROJECT_FILE overrides the path).
# kipscope.yaml is local and gitignored (D-077): copy this file and adapt it to your DBC. The names below
# are placeholders; demo/kipscope.yaml is the project file of the demo recording.
# Restart the server after editing. An invalid file stops the server with one message per problem.
# Top-level keys: `display`, `measurement` and `events`, all optional; any other key is an error.

# Optional. Names only change what the UI shows; signal IDs, the API, the CLI and the workspace keep full names.
display:
  # Optional ordered list of rules; the first rule whose `match` finds the full source name wins.
  names:
    # ICL_3A2h.SPEED_DISP -> SPEED_DISP; on a collision SPEED_DISP (ICL)
    # match: JavaScript RegExp without flags, run on the name without data reference; named groups feed the templates.
    - match: '^(?<message>[^.]+?)_[0-9A-Fa-f]+h\.(?<signal>.+)$'
      # show: shown name; {group} inserts a named group of `match`. Renders empty -> full name.
      show: '{signal}'
      # collision: optional; used instead of `show` when two different signals would show the same name.
      collision: '{signal} ({message})'
    # CLIM_A1.T_SET -> T_SET; on a collision T_SET (CLIM_A1)
    - match: '^(?<message>[^.]+)\.(?<signal>.+)$'
      show: '{signal}'
      collision: '{signal} ({message})'
  # rename: optional map from full source name to shown name; beats every rule and gets no collision suffix.
  # rename:
  #   ICL_3A2h.SPEED_DISP: Speed
  # groups: optional ordered list of rules that sort the explorer list into groups (D-053).
  # For each signal the first rule that matches and renders non-blank wins; the group is that render, trimmed.
  # Unlike `names`, a blank render falls through to the next rule.
  # A signal no rule gives a group, or whose render is `Other`, lands in `Other`, always listed last.
  # Without `groups` the explorer list is flat.
  groups:
    # match: optional JavaScript RegExp without flags on the full source name; without it the rule applies to every signal.
    # group: the group name; {sender} inserts the sending ECU of the signal's DBC message (`BO_` transmitter),
    # blank without a DBC entry or for `Vector__XXX`. A named group of `match` inserts its text, e.g. {ecu};
    # a named group may not be called `sender`.
    # ICL_3A2h.SPEED_DISP -> CGW (its DBC sender)
    - group: '{sender}'
    # DCU_2B8h.HTR_HV_Volt -> DCU: fallback for messages h-can.dbc gives no sender (D-053 Q1)
    - match: '^(?<ecu>DCU|HVM)_'
      group: '{ecu}'
    # BMS.soc, BMS.cell_voltage.001 -> BMS (diag): decoded diagnostic readings, no DBC (D-058)
    - match: '^(?<ecu>[A-Z][A-Z0-9]*)\.[a-z]'
      group: '{ecu} (diag)'

# Optional: measurement info, shown in the footer and held in the workspace (`kipscope state`).
# This is only the start value: `kipscope measurement name|object|meta|clear` changes it, and
# commands win until restart. A restart reads this file again and drops those changes; nothing writes the file.
# Texts are trimmed; numbers and true/false become text ("3"); empty or null counts as absent;
# no text may hold a line break or control character.
# measurement:
#   # name: the measurement under investigation; at most 120 characters.
#   name: Testfahrt A9
#   # object: the vehicle or device under test; at most 120 characters.
#   object: smart451
#   # meta: further key: value entries, at most 8, in file order.
#   # A key has at most 40 characters, starts with a letter and holds only letters, digits, space, _ . -
#   # A value has at most 200 characters.
#   meta:
#     driver: Jan
#     run: 3

# Optional: signals whose state changes are on the events line from the start (D-059).
# Like `measurement` this is only the start value: `kipscope events add|remove` changes it, and commands
# win until restart; nothing writes the file. `events` holds only `signals`.
events:
  # signals: at most 8 signal IDs (<data ref>/<signal name>). A signal not recorded yet waits quietly
  # (logged once per catalog load) and shows once recorded; a signal without states is skipped.
  signals:
    - smart451/DCU_1F4h.IgnMode      # ignition (D-058, Q4)
    - smart451/BMS.contactor         # HV contactor (D-058, Q5)
