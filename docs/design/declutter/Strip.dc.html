<div style="width: 1440px; height: 860px; box-sizing: border-box; padding: 20px 24px 0; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; color: #0f172a; background: #f8fafc; overflow: hidden;">

              <span>{{s.cap2}}</span>
            </div>
            <div title="{{s.tt}}" style="position: relative; width: 1192px; height: {{s.h}}px; padding: {{s.pt}}px 10px 0; box-sizing: border-box; background: #ffffff; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0;">
              <div style="position: relative; height: {{s.th}}px;">

                  <span title="{{q.tt}}" style="position: absolute; left: {{q.l}}; width: {{q.w}}; margin-left: {{q.ml}}px; top: {{q.t}}px; height: {{q.h}}px; background: {{q.bg}}; border-radius: {{q.rad}}px; box-shadow: {{q.sh}}; border-left: {{q.bl}}; box-sizing: border-box;"></span>
                </sc-for>
                <sc-if value="{{s.hasArea}}" hint-placeholder-val="{{ true }}">
                  <svg viewBox="0 0 1000 100" preserveAspectRatio="none" style="position: absolute; left: 0; top: {{s.aT}}px; width: 100%; height: {{s.aH}}px;" aria-hidden="true">
                    <path d="{{s.area}}" fill="{{s.aFill}}"></path>
                  </svg>
                </sc-if>

                  <div style="position: absolute; left: 0; right: 0; top: {{s.bT}}px; height: {{s.bH}}px; display: flex; align-items: flex-end; gap: 1px;">
                    <sc-for list="{{s.bars}}" as="b" hint-placeholder-count="75">
                      <span style="flex: 1 1 0; height: {{b.h}}px; background: {{b.c}}; border-radius: 1px 1px 0 0;"></span>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-for list="{{s.over}}" as="q" hint-placeholder-count="4">
                  <span title="{{q.tt}}" style="position: absolute; left: {{q.l}}; width: {{q.w}}; margin-left: {{q.ml}}px; top: {{q.t}}px; height: {{q.h}}px; background: {{q.bg}}; border-radius: {{q.rad}}px; box-shadow: {{q.sh}}; border-left: {{q.bl}}; box-sizing: border-box;"></span>

                  <div style="font-weight: 600;">{{s.tipHead}}</div>
                  <sc-for list="{{s.tipLines}}" as="l" hint-placeholder-count="2">
                    <div style="display: flex; gap: 8px;"><span>{{l.t}}</span><span style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">{{l.n}}</span><span>{{l.x}}</span></div>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 3px; height: 7px; border-radius: 1px; background: #7c3aed;"></span>Change</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 3px; height: 7px; border-radius: 1px; background: #be123c;"></span>Fault</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 3px; height: 7px; border-radius: 1px; background: #b45309;"></span>Stored</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 3px; height: 7px; border-radius: 1px; background: #64748b;"></span>Other</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 5px; height: 7px; border-radius: 1px; background: #ffffff; box-shadow: inset 0 0 0 1px #be123c;"></span>Fault memory read</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 18px; height: 3px; border-radius: 1px; background: #94a3b8;"></span>Data</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="display: inline-flex; gap: 3px;"><span style="width: 8px; height: 3px; background: #94a3b8;"></span><span style="width: 8px; height: 3px; background: #94a3b8;"></span></span>Gap (no rows ≥ 2 s)</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 18px; height: 10px; background: rgba(2,132,199,0.10); border-left: 1px solid #0284c7; border-right: 1px solid #0284c7;"></span>Shown range</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 18px; height: 2px; background: #475569;"></span>Drive</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 1px; height: 12px; background: #0f172a;"></span>A <span style="width: 0; height: 12px; border-left: 1px dashed #0f172a; margin-left: 4px;"></span>B</span>
  </div>
</div>
</x-dc>

  pins: [[1.575, 1, 'change', 0, '11:07:04.246 · Change · IgnCurMode NONE → KEYON'], [74.985, 2, 'change', 0, '2 events · 2 changes'], [97.79, 1, 'change', 0, '12:12:29.888 · Change · IgnCurMode KEYON → NONE']],
  range: [67.65, 79.41], a: null, b: null };

function R(o) { return Object.assign({ l: '0%', w: '100%', ml: 0, t: 0, h: 1, bg: 'transparent', rad: 0, sh: 'none', bl: 'none', tt: '' }, o); }
function P(v) { return v + '%'; }
function px(pct) { return pct / 100 * TRACK; }
function cov(s, t, h) {
  const out = []; const r0 = s.range[0], r1 = s.range[1];
  s.cov.forEach(function (c) {
    [[c[0], Math.min(c[1], r0), '#94a3b8'], [Math.max(c[0], r0), Math.min(c[1], r1), ACC], [Math.max(c[0], r1), c[1], '#94a3b8']].forEach(function (p) {

    return R({ l: P(p[0]), w: w + 'px', ml: -w / 2, t: t, h: square ? 5 : h, bg: p[3] ? '#ffffff' : c, sh: p[3] ? 'inset 0 0 0 1px ' + c : 'none', rad: 1, tt: p[4] || (p[1] + (p[1] > 1 ? ' events' : ' event')) });

    R({ l: P(r0), w: '1px', t: 0, h: h, bg: ACC }), R({ l: P(r1), w: '1px', ml: -1, t: 0, h: h, bg: ACC })];
}
function cursors(s, h) {

  if (s.b !== null) out.push(R({ l: P(s.b), w: '1px', t: 0, h: h, bl: '1px dashed #0f172a', tt: 'B 15:11:40' }));
  return out;
}
// continuous area through bucket centres, in a 1000 x 100 box
function area(counts, off, span, bw, sqrt, floor) {
  const m = Math.max.apply(null, counts); const pts = [];
  counts.forEach(function (c, i) {

const CAP3b = 'shown 26-10-13 15:06  0:12 · 1 of 2 events · A 15:09:12 · B 15:11:40';
