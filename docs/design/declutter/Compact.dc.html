<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f8fafc}
a{color:#0369a1}a:hover{color:#0c4a6e}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}
.ib:hover{background:#f1f5f9}
.gh:hover{background:#e2e8f0}
.row:hover{background:#f8fafc}
</style>
</helmet>
<div style="width: 1000px; height: 557px; display: flex; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; color: #0f172a; background: #f8fafc; overflow: hidden;">

  <aside style="flex: 0 0 208px; width: 208px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 6px; padding: 6px; background: #ffffff; border-right: 1px solid #e2e8f0; box-sizing: border-box;">
    <div role="tablist" aria-label="Sidebar" style="display: flex; height: 26px; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden;">
      <button role="tab" aria-selected="true" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: #0f172a; color: #ffffff; font-weight: 600;">Signals <span style="font-weight: 400; color: #cbd5e1; font-variant-numeric: tabular-nums;">415</span></button>
      <button role="tab" aria-selected="false" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-left: 1px solid #cbd5e1; background: #ffffff;">Events <span style="color: #64748b; font-variant-numeric: tabular-nums;">2</span></button>
    </div>
    <label style="display: block;">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search signals</span>
      <input type="search" placeholder="Search name, description, unit" style="width: 100%; height: 28px; padding: 0 8px; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; color: #0f172a; box-sizing: border-box;">
    </label>
    <label style="display: flex; align-items: center; gap: 6px; color: #475569;">
      <span>Add to</span>
      <select style="flex: 1 1 auto; min-width: 0; height: 26px; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; padding: 0 4px;">
        <option>Drive</option>
        <option>Battery</option>
        <option>New window</option>
      </select>
    </label>
    <div style="flex: 1 1 auto; min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 2px;">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="14">
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <button class="gh" aria-expanded="{{g.expanded}}" style="display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 8px; border: 0; border-radius: 4px; background: #f1f5f9; text-align: left;">
            <span style="width: 10px; color: #64748b; font-size: 9px;">{{g.chev}}</span>
            <span style="font-weight: 600; color: #334155;">{{g.name}}</span>
            <span style="margin-left: auto; color: #64748b; font-variant-numeric: tabular-nums;">{{g.count}}</span>
          </button>
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="0">
            <div class="row" title="{{r.name}} · {{r.desc}}" style="min-width: 0; display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 6px 0 22px; border-radius: 4px;">
              <span style="flex: 0 0 7px; height: 7px; border-radius: 999px; background: {{r.dot}};"></span>
              <span style="flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #1e293b;">{{r.name}}</span>
              <span title="{{r.desc}}" style="flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #64748b;">{{r.desc}}</span>
              <span style="flex: 0 0 auto; color: #64748b;">{{r.unit}}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </aside>

  <main style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;">

    <div style="flex: 0 0 36px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #ffffff; border-bottom: 1px solid #e2e8f0; box-sizing: border-box;">
      <button class="ib" aria-label="Hide sidebar" title="Show or hide the signal list · s" style="width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; padding: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
      </button>
      <button class="ib" style="height: 26px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff;">Views
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <span style="width: 1px; height: 18px; background: #e2e8f0; margin: 0 4px;"></span>

      <button class="ib" aria-haspopup="dialog" title="Go to: pick a range or type one · t" style="width: 212px; height: 26px; display: inline-flex; align-items: center; gap: 8px; padding: 0 8px; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; font-variant-numeric: tabular-nums; text-align: left;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line></svg>
        <span title="Tue 2026-10-13 15:06" style="font-weight: 600;">26-10-13</span>
        <span title="Tue 2026-10-13 15:06">15:06</span>
        <span title="Duration 12 min" style="margin-left: auto; display: inline-flex; align-items: center; gap: 3px; color: #64748b;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="14" r="8"></circle><line x1="12" y1="14" x2="12" y2="10"></line><line x1="10" y1="2" x2="14" y2="2"></line></svg>0:12 h</span>
      </button>
      <button class="ib" aria-label="Back" title="Back: the range before · Backspace" style="width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; padding: 0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 14 4 9 9 4"></polyline><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>
      </button>
      <button class="ib" aria-label="Reset: show all data" title="Reset: fit all data · Home" style="width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; padding: 0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="5" x2="3" y2="19"></line><line x1="21" y1="5" x2="21" y2="19"></line><line x1="7" y1="12" x2="17" y2="12"></line><polyline points="10 9 7 12 10 15"></polyline><polyline points="14 9 17 12 14 15"></polyline></svg>
      </button>
      <button class="ib" aria-label="Link time axes" aria-pressed="true" title="Link time axes: on (all windows show one range)" style="width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #7dd3fc; border-radius: 4px; background: #e0f2fe; padding: 0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>
      </button>
      <span style="width: 1px; height: 18px; background: #e2e8f0; margin: 0 4px;"></span>
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
        <button aria-pressed="{{t.pressed}}" title="{{t.tip}}" style="height: 26px; min-width: 30px; padding: 0 9px; border-radius: 4px; border: 1px solid #7dd3fc; background: #e0f2fe; color: #0369a1; font-weight: 600;">{{t.label}}</button>
      </sc-for>

      <span style="flex: 1 1 auto;"></span>
      <button class="ib" style="height: 26px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff;">Share</button>
      <button class="ib" aria-label="More" title="Digits, + Values window" style="width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; padding: 0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#334155" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </button>
      <button class="ib" aria-label="Help" title="Help · ?" style="width: 26px; height: 26px; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; padding: 0; font-weight: 600; color: #334155;">?</button>
    </div>

    <div style="flex: 0 0 30px; display: flex; align-items: center; padding: 0 8px; background: #ffffff; border-bottom: 1px solid #e2e8f0; box-sizing: border-box; font-variant-numeric: tabular-nums;">
            <button class="ib" aria-label="Previous session" title="Previous session · [" style="flex: 0 0 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg>
      </button>
      <button class="ib" aria-haspopup="dialog" aria-label="Session 3 of 17, aligned at the start: sessions and align" title="Sessions of the catalog · aligned at the session start" style="flex: 0 0 88px; height: 24px; border: 1px solid #cbd5e1; border-radius: 999px; background: #ffffff; padding: 0 2px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; box-sizing: border-box;">3 / 17 <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="3" x2="4" y2="21"></line><line x1="9" y1="9" x2="20" y2="9"></line><line x1="9" y1="15" x2="16" y2="15"></line></svg><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.6" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      <button class="ib" aria-label="Next session" title="Next session · ]" style="flex: 0 0 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg>
      </button>
      <span title="Drive 3 · Tue 2026-10-13 15:06 · 0:10 h · driving · rows 9.91e+6" style="flex: 1 1 auto; min-width: 0; margin-left: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600;">Drive 3</span>
      <span title="Duration 10 min" style="flex: 0 0 64px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 3px; color: #64748b; white-space: nowrap;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="14" r="8"></circle><line x1="12" y1="14" x2="12" y2="10"></line><line x1="10" y1="2" x2="14" y2="2"></line></svg>0:10 h</span>
      <button class="ib" title="Unlink: the whole vehicle smart451" style="flex: 0 0 64px; margin-left: 10px; height: 24px; border: 1px solid #cbd5e1; border-radius: 999px; background: #ffffff; padding: 0;">Unlink</button>
    </div>

    <div title="Shown 0:12 h of 0:12 h in scope · data 15:07 – 15:17 · 1 of 2 events" style="flex: 0 0 28px; display: flex; align-items: flex-start; padding: 0 8px; background: #ffffff; border-bottom: 1px solid #e2e8f0; box-sizing: border-box;">
      <span title="Tue 2026-10-13 15:06:03" style="flex: 0 0 48px; height: 27px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; font-size: 10px; color: #64748b; font-variant-numeric: tabular-nums;">15:06</span>
      <div style="position: relative; flex: 1 1 auto; min-width: 0; height: 27px;">
        <span style="position: absolute; left: 0; right: 0; top: 0; height: 27px; background: rgba(2,132,199,0.08);"></span>
        <span style="position: absolute; left: 0; right: 0; top: 13px; height: 1px; background: #e2e8f0;"></span>
        <span title="Data 15:07:03 – 15:17:33" style="position: absolute; left: 8.1%; width: 83.94%; top: 12px; height: 3px; border-radius: 1px; background: #0284c7;"></span>
        <span style="position: absolute; left: 0; top: 0; width: 1px; height: 27px; background: #0284c7;"></span>
        <span style="position: absolute; right: 0; top: 0; width: 1px; height: 27px; background: #0284c7;"></span>
        <span style="position: absolute; left: 25.2%; top: 0; width: 1px; height: 27px; background: #0f172a;"></span>
        <span style="position: absolute; left: 44.93%; top: 0; width: 0; height: 27px; border-left: 1px dashed #0f172a;"></span>
        <span style="position: absolute; left: 9.54%; top: 2px; width: 2px; height: 7px; margin-left: -1px; border-radius: 1px; background: #7c3aed;"></span>
        <span title="15:07:14.560 · Change · IgnCurMode NONE → KEYON" style="position: absolute; left: 9.54%; top: 0; width: 10px; height: 11px; margin-left: -5px;"></span>
        <button aria-label="Bring cursor A into view" title="A 15:09:12 · click or Shift+A: bring A into view" style="position: absolute; z-index: 1; left: 25.2%; margin-left: -12px; top: 10px; width: 24px; height: 24px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: flex-start; justify-content: center;"><span style="margin-top: 5px; width: 14px; height: 12px; border-radius: 2px; box-sizing: border-box; font-size: 9px; font-weight: 700; line-height: 12px; text-align: center; background: #0f172a; color: #ffffff;">A</span></button>
        <button aria-label="Bring cursor B into view" title="B 15:11:40 · click or Shift+B: bring B into view" style="position: absolute; z-index: 1; left: 44.93%; margin-left: -12px; top: 10px; width: 24px; height: 24px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: flex-start; justify-content: center;"><span style="margin-top: 5px; width: 14px; height: 12px; border-radius: 2px; box-sizing: border-box; font-size: 9px; font-weight: 700; line-height: 12px; text-align: center; background: #ffffff; color: #0f172a; box-shadow: inset 0 0 0 1px #0f172a;">B</span></button>
      </div>
      <span title="Tue 2026-10-13 15:18:33" style="flex: 0 0 48px; height: 27px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; font-size: 10px; color: #64748b; font-variant-numeric: tabular-nums; justify-content: flex-end;">15:18</span>
    </div>

    <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow: hidden;">
      <sc-for list="{{windows}}" as="w" hint-placeholder-count="2">
        <section style="flex: 0 0 auto; min-width: 0; display: flex; flex-direction: column; background: #ffffff; border: {{w.border}}; border-radius: 4px; box-sizing: border-box; padding: 0 10px 4px;">
          <header style="display: flex; align-items: center; gap: 8px; height: 26px;">
            <span style="font-weight: 600;">{{w.title}}</span>
            <sc-if value="{{w.isTarget}}" hint-placeholder-val="{{ true }}">
              <span style="padding: 1px 7px; border-radius: 999px; background: #e0f2fe; color: #075985; font-size: 11px;">Add to</span>
            </sc-if>
            <span style="flex: 1 1 auto;"></span>
            <span title="{{w.modeHint}}" style="flex: 0 0 64px; text-align: right; font-size: 11px; color: #64748b; font-variant-numeric: tabular-nums;">{{w.mode}}</span>
            <button class="ib" aria-label="Window menu" title="Line, step, markers · Min/max · Rename · Remove" style="width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; padding: 0;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#475569" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
            </button>
          </header>
          <div style="display: flex; height: 12px; margin-bottom: 6px; font-size: 10px; line-height: 12px; color: #334155;">
            <sc-for list="{{w.axesL}}" as="ax" hint-placeholder-count="2">
              <span title="{{ax.name}}" style="flex: 0 0 38px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 3px; padding-right: 4px; box-sizing: border-box; white-space: nowrap;"><span style="flex: 0 0 8px; height: 2px; background: {{ax.color}};"></span>{{ax.unit}}</span>
            </sc-for>
            <span style="flex: 1 1 auto;"></span>
            <sc-for list="{{w.axesR}}" as="ax" hint-placeholder-count="1">
              <span title="{{ax.name}}" style="flex: 0 0 40px; display: inline-flex; align-items: center; gap: 3px; padding-left: 4px; box-sizing: border-box; white-space: nowrap;"><span style="flex: 0 0 8px; height: 2px; background: {{ax.color}};"></span>{{ax.unit}}</span>
            </sc-for>
          </div>
          <div style="display: flex; height: {{plotH}}px; font-size: 11px; font-variant-numeric: tabular-nums;">
            <sc-for list="{{w.axesL}}" as="ax" hint-placeholder-count="2">
              <div style="position: relative; flex: 0 0 38px;">
                <sc-for list="{{ax.ticks}}" as="t" hint-placeholder-count="5">
                  <span style="position: absolute; right: 4px; top: {{t.top}}%; transform: translateY(-50%); color: #334155;">{{t.label}}</span>
                </sc-for>
              </div>
            </sc-for>
            <div style="position: relative; flex: 1 1 auto; min-width: 0; border-left: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;">
              <sc-for list="{{grid}}" as="g" hint-placeholder-count="5">
                <span style="position: absolute; left: 0; right: 0; top: {{g.top}}%; height: 1px; background: #f1f5f9;"></span>
              </sc-for>
              <sc-for list="{{xticks}}" as="x" hint-placeholder-count="6">
                <span style="position: absolute; top: 0; bottom: 0; left: {{x.left}}%; width: 1px; background: #f1f5f9;"></span>
              </sc-for>
              <svg viewBox="0 0 1000 200" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;" aria-hidden="true">
                <sc-for list="{{w.series}}" as="s" hint-placeholder-count="3">
                  <path d="{{s.path}}" fill="none" stroke="{{s.color}}" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
                </sc-for>
              </svg>
              <span title="15:07:14.560 · Change · IgnCurMode NONE → KEYON" style="position: absolute; top: 0; bottom: 0; left: 9.54%; width: 3px; margin-left: -1px; border-left: 1px dashed rgba(124,58,237,0.5); box-sizing: border-box;"></span>
              <span style="position: absolute; top: 0; bottom: 0; left: 25.2%; width: 0; border-left: 1px solid #0f172a;"></span>
              <span style="position: absolute; top: 0; bottom: 0; left: 44.9%; width: 0; border-left: 1px dashed #0f172a;"></span>
              <span style="position: absolute; top: -1px; left: 25.2%; transform: translateX(-50%); padding: 0 4px; border-radius: 2px; background: #0f172a; color: #ffffff; font-size: 10px; font-weight: 600;">A</span>
              <span style="position: absolute; top: -1px; left: 44.9%; transform: translateX(-50%); padding: 0 4px; border-radius: 2px; background: #ffffff; border: 1px solid #0f172a; color: #0f172a; font-size: 10px; font-weight: 600;">B</span>
            </div>
            <sc-for list="{{w.axesR}}" as="ax" hint-placeholder-count="1">
              <div style="position: relative; flex: 0 0 40px;">
                <sc-for list="{{ax.ticks}}" as="t" hint-placeholder-count="5">
                  <span style="position: absolute; left: 4px; top: {{t.top}}%; transform: translateY(-50%); color: #334155;">{{t.label}}</span>
                </sc-for>
              </div>
            </sc-for>
          </div>
          <div style="display: flex; height: 16px; font-size: 10px; color: #475569; font-variant-numeric: tabular-nums;">
            <span style="flex: 0 0 {{w.lw}}px;"></span>
            <div style="position: relative; flex: 1 1 auto;">
              <sc-for list="{{xticks}}" as="x" hint-placeholder-count="6">
                <span style="position: absolute; top: 3px; left: {{x.left}}%; transform: translateX(-50%);">{{x.label}}</span>
              </sc-for>
            </div>
            <span style="flex: 0 0 {{w.rw}}px;"></span>
          </div>
          <table style="width: 100%; margin-top: 2px; border-collapse: collapse; font-variant-numeric: tabular-nums;">
            <thead>
              <tr style="height: 17px; color: #475569; font-size: 11px;">
                <th style="width: 14px;"></th>
                <th style="text-align: left; font-weight: 400;"></th>
                <th style="width: 48px;"></th>
                <th style="width: 72px; text-align: right; font-weight: 600; color: #0f172a;">A 15:09:12</th>
                <th style="width: 72px; text-align: right; font-weight: 600; color: #0f172a;">B 15:11:40</th>
                <th style="width: 72px; text-align: right; font-weight: 600; color: #0f172a;">Δ 0:02:28</th>
              </tr>
            </thead>
            <tbody>
              <sc-for list="{{w.series}}" as="s" hint-placeholder-count="3">
                <tr style="height: 16px; border-top: 1px solid #f1f5f9;">
